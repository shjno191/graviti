<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AST to Mermaid Flowchart</title>
    <!-- Thư viện Acorn JS via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/acorn/8.11.2/acorn.min.js"></script>
    <!-- Thư viện Mermaid JS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; padding: 20px; }
        textarea { width: 100%; height: 250px; font-family: monospace; font-size: 14px; padding: 10px; margin-bottom: 20px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .output-container { display: flex; gap: 20px; margin-top: 20px; }
        .column { flex: 1; padding: 15px; border: 1px solid #ccc; border-radius: 4px; background: #f9f9f9; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>

    <h2>Phân tích Code -> Mermaid Flowchart</h2>
    
    <textarea id="sourceCode">
// Sample JavaScript Code
function runApp() {
    initSystem();
    loadUserData();
}

function initSystem() {
    connectDatabase();
    setupLogger();
}

const loadUserData = () => {
    fetchApi();
    renderUI();
}

function connectDatabase() {}
function setupLogger() {}
function fetchApi() {}
function renderUI() {}

runApp(); // Lời gọi từ Global
    </textarea>
    
    <div>
        <button id="btnAnalyze">Phân Tích & Render Biểu Đồ</button>
    </div>

    <div class="output-container">
        <!-- Khung chứa Syntax -->
        <div class="column">
            <h3>Mermaid Syntax</h3>
            <pre id="mermaidSyntax"></pre>
        </div>
        
        <!-- Khung Render Giao Diện -->
        <div class="column">
            <h3>Graph Preview</h3>
            <div id="mermaidPreview"></div>
        </div>
    </div>

    <script>
        // Cấu hình khởi tạo Mermaid
        mermaid.initialize({ startOnLoad: false, theme: 'default' });

        document.getElementById('btnAnalyze').addEventListener('click', async () => {
            const code = document.getElementById('sourceCode').value;
            
            try {
                // 1 & 2. Phân tích code, tạo Map từ AST
                const callMap = analyzeAstToMap(code);
                
                // 3. Generate chuỗi Mermaid
                const mermaidScript = generateMermaidSyntax(callMap);
                document.getElementById('mermaidSyntax').textContent = mermaidScript;

                // 4. Render vào giao diện HTML
                const previewDiv = document.getElementById('mermaidPreview');
                previewDiv.innerHTML = ''; // Clear cũ
                
                if (mermaidScript) {
                    // Dùng Mermaid API mới để render string ra SVG
                    const { svg } = await mermaid.render('mermaid-chart-svg', mermaidScript);
                    previewDiv.innerHTML = svg;
                }
            } catch (err) {
                alert("Lỗi phân tích cú pháp Code: " + err.message);
                console.error(err);
            }
        });

        function analyzeAstToMap(sourceCode) {
            // Bước 1: Parse string thành AST
            const ast = acorn.parse(sourceCode, { ecmaVersion: 2020, sourceType: "module" });
            
            // Map để lưu trữ caller -> Set(callees)
            const mapRelations = new Map();

            // Hàm đệ quy duyệt cây AST
            function traverse(node, currentFunction) {
                if (!node) return;

                let nextFunction = currentFunction;

                // Xác định nếu Node là một khai báo hàm mới
                if (node.type === "FunctionDeclaration" && node.id) {
                    nextFunction = node.id.name;
                } else if (node.type === "VariableDeclarator" && 
                          (node.init?.type === "ArrowFunctionExpression" || node.init?.type === "FunctionExpression")) {
                    nextFunction = node.id.name;
                }

                // Nếu là CallExpression -> Ghi nhận vào Map
                if (node.type === "CallExpression") {
                    let callee = "Unknown";
                    
                    if (node.callee.type === "Identifier") {
                        callee = node.callee.name; // Gọi hàm bình thường: func()
                    } else if (node.callee.type === "MemberExpression") {
                        // Gọi hàm qua object: console.log()
                        const obj = node.callee.object.name || "Object";
                        const prop = node.callee.property.name || "method";
                        callee = `${obj}.${prop}`;
                    }

                    // Lưu vào Map
                    if (!mapRelations.has(currentFunction)) {
                        mapRelations.set(currentFunction, new Set());
                    }
                    mapRelations.get(currentFunction).add(callee);
                }

                // Chạy đệ quy đi sâu vào các node con
                for (const key in node) {
                    if (node[key] && typeof node[key] === 'object') {
                        if (Array.isArray(node[key])) {
                            node[key].forEach(child => traverse(child, nextFunction));
                        } else {
                            traverse(node[key], nextFunction);
                        }
                    }
                }
            }

            // Bắt đầu từ Node Root với scope là "Global"
            traverse(ast, "Global");
            return mapRelations;
        }

        function generateMermaidSyntax(mapRelations) {
            if (mapRelations.size === 0) return "";

            let syntax = "graph TD;\n";
            
            mapRelations.forEach((callees, caller) => {
                callees.forEach(callee => {
                    // Xóa các khoảng trắng/kí tự đặc biệt nếu cần để Mermaid không lỗi
                    const safeCaller = caller.replace(/[^a-zA-Z0-9_]/g, "_");
                    const safeCallee = callee.replace(/[^a-zA-Z0-9_]/g, "_");
                    
                    // Thêm alias để dễ nhìn (vd: NodeA["Function Name"])
                    syntax += `    ${safeCaller}["${caller}"] --> ${safeCallee}["${callee}"];\n`;
                });
            });

            return syntax;
        }
    </script>
</body>
</html>
